; Mealboard's own PHP settings, added to a copy of XAMPP's php.ini by deploy\apache-start.bat
; (the result is deploy\php\php.ini, used only by the Mealboard Apache).

[opcache]
opcache.enable=1
; On Windows every PHP under the same account shares ONE code cache unless it has its own id. Without this,
; the Mealboard Apache would run code cached by XAMPP's Apache (and old code after an update).
opcache.cache_id=mealboard
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; Production: never re-check the code files; run deploy\optimize.bat and restart Apache after a change.
opcache.validate_timestamps=0
opcache.save_comments=1
; XAMPP turns the JIT on without memory for it, which only logs "VirtualProtect() failed": off.
opcache.jit=disable
opcache.jit_buffer_size=0

realpath_cache_size=4096K
realpath_cache_ttl=600
display_errors=Off
log_errors=On
