# Mealboard (Laravel) on its own Apache, next to XAMPP's (which is left alone).
#   start:  deploy\apache-start.bat      (http://127.0.0.1:8088)
#   stop:   deploy\apache-stop.bat
# Uses XAMPP's Apache binaries and PHP (mod_php, OPcache on). The site root is public\ only, so .env, storage\,
# backups\ and the code are never reachable from a browser.

Define MB_ROOT "C:/xampp/htdocs/mealboard-laravel"
Define MB_PORT 8088

ServerRoot "C:/xampp/apache"
Listen ${MB_PORT}
ServerName 127.0.0.1:${MB_PORT}
PidFile "${MB_ROOT}/storage/logs/apache.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule expires_module modules/mod_expires.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "${MB_ROOT}/deploy/php"

# One process with a pool of worker threads (Windows). 64 threads is plenty for one core.
<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxConnectionsPerChild 0
</IfModule>

# Keep connections open between requests (the door app and browsers reuse them).
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
Timeout 60
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Windows: these two are known to leave some connections hanging; off is the safe setting.
EnableSendfile Off
EnableMMAP Off
AcceptFilter http none
AcceptFilter https none

TypesConfig conf/mime.types
ErrorLog "${MB_ROOT}/storage/logs/apache-error.log"
LogLevel warn
# The access log costs time at 200+ requests a second: off by default, turn on to investigate.
# LogFormat "%h %t \"%r\" %>s %b %D" timed
# CustomLog "${MB_ROOT}/storage/logs/apache-access.log" timed

DocumentRoot "${MB_ROOT}/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${MB_ROOT}/public">
    Options -Indexes +FollowSymLinks
    # The rewrite rules are here instead of in .htaccess, so Apache doesn't look for .htaccess files on every request.
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Built files (CSS, JS, fonts) have a hash in their name: cache them for a year. Photos: a week.
<IfModule expires_module>
    <LocationMatch "^/build/">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>

# The PHP settings of this site (its own OPcache, code files never re-checked, JIT off) are in
# deploy\php-overrides.ini, added to a copy of XAMPP's php.ini by apache-start.bat. After a code change:
# deploy\optimize.bat, then restart this Apache.
